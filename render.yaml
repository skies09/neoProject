services:
  - type: web
    name: neoproject-django
    env: python
    # migrate + CSV import run here so free-tier deploys need no Shell (DATABASE_URL available at build).
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py import_dogdb_csv DogDB.csv --update
    startCommand: gunicorn neoProject.wsgi:application --timeout 180 --graceful-timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: PROD
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: neoproject-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: neoproject-django.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://the-neo-project.web.app

databases:
  - name: neoproject-db
    databaseName: neoproject
    user: neoproject_user
    plan: free

