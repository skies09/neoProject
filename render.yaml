services:
  - type: web
    name: neoproject-django
    env: python
    # HTTP health check must return 2xx (see /healthz). Bind to Render's PORT.
    healthCheckPath: /healthz
    # migrate + CSV import at build (no Shell). Optional: set DOGDB_CSV_URL to pull CSV from HTTPS (skip flaky upload API).
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python scripts/fetch_dogdb_build.py && python manage.py import_dogdb_csv DogDB.csv --update
    # Migrate at boot uses runtime DATABASE_URL (fixes prod still on varchar(8) if build-time migrate missed the DB).
    startCommand: python manage.py migrate --noinput && gunicorn neoProject.wsgi:application --bind 0.0.0.0:$PORT --timeout 180 --graceful-timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: PROD
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: neoproject-db
          property: connectionString
      # Leading dot = any *.onrender.com (avoids DisallowedHost if service URL renames)
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://the-neo-project.web.app
      # Optional: POST /api/breeds/import-csv-url/ with tiny JSON (server fetches CSV). No Shell.
      - key: BREED_IMPORT_URL_TOKEN
        sync: false
      - key: BREED_IMPORT_URL_PREFIXES
        sync: false
      # Optional: HTTPS URL to DogDB.csv — build downloads it then imports (no multipart / 502).
      - key: DOGDB_CSV_URL
        sync: false

databases:
  - name: neoproject-db
    databaseName: neoproject
    user: neoproject_user
    plan: free

